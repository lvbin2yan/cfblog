name = "cfblog"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Local development settings
# Note: AI binding will still connect to remote even in local mode
# This is expected behavior and will incur usage charges

# 定时触发：每天凌晨 3 点运行 (UTC 时间)
[triggers]
crons = ["0 3 * * *"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "cfblog-db"
database_id = "a9aea80b-9712-4b18-95bb-e11fba4b20aa"

# R2 Storage binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cfblog-media"

# Workers AI binding
# Note: In local dev mode, AI still connects to remote Cloudflare AI
[ai]
binding = "AI"

# Environment variables
[vars]
JWT_SECRET = "your-jwt-secret-here-change-in-production"

[assets]
binding = "ASSETS"
directory = "./public"
not_found_handling = "none"
run_worker_first = true
